# Feldcheck-Briefkasten: neue Einsendungen aus der App einarbeiten (Zweig "eingang" oder privates Eingangs-Repo,
# siehe briefkasten.json und karte/BRIEFKASTEN.md), Karten neu berechnen, prüfen und als Änderungsvorschlag
# (Pull Request "feldcheck-update") zur Freigabe vorlegen.
# Jeder Lauf erledigt alles, was ansteht (abgelehnte beiseitelegen, neue einarbeiten). Deshalb schadet es nicht,
# wenn GitHub einen wartenden Lauf zugunsten eines neueren verwirft.
name: Feldcheck einarbeiten

on:
  repository_dispatch:
    types: [feldcheck]          # die App meldet jede Einsendung
  workflow_dispatch:            # von Hand starten
  schedule:
    - cron: '17 4 * * *'        # täglich nachsehen, falls eine Meldung verloren ging
  pull_request:
    types: [closed]             # freigegeben oder abgelehnt: danach Rest einarbeiten bzw. beiseitelegen
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  statuses: write               # Ergebnis der Prüfung am Vorschlag

concurrency:
  group: feldcheck
  cancel-in-progress: false

jobs:
  einarbeiten:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'feldcheck-update'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Briefkasten öffnen
        env:
          INBOX_TOKEN: ${{ secrets.INBOX_TOKEN }}
        run: |
          set -euo pipefail
          git config --global user.name "Feldcheck-Bot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # briefkasten.json: wohin die App sendet. Eigenes (privates) Repo = Eingangs-Repo, gelesen mit Secret INBOX_TOKEN
          read -r REPO ZWEIG ORDNER < <(python3 -c "import json; d = json.load(open('briefkasten.json')); print(d['repo'], d['zweig'], d['ordner'])")
          Q="$RUNNER_TEMP/quelle"
          if [ "$REPO" != "${{ github.repository }}" ]; then
            [ -n "${INBOX_TOKEN:-}" ] || { echo "::error::briefkasten.json nennt $REPO, aber das Secret INBOX_TOKEN fehlt"; exit 1; }
            git -c http.https://github.com/.extraheader= clone -q --depth 50 --branch "$ZWEIG" \
              "https://x-access-token:${INBOX_TOKEN}@github.com/${REPO}.git" "$Q" || { echo "::error::Eingangs-Repo $REPO nicht lesbar"; exit 1; }
            echo "Q_ANON=--anon" >> "$GITHUB_ENV"
          else
            git fetch -q --depth=50 origin "$ZWEIG" || { echo "Noch kein Zweig $ZWEIG."; echo "Q_NONE=1" >> "$GITHUB_ENV"; exit 0; }
            git worktree add -q --detach "$Q" FETCH_HEAD
            echo "Q_ANON=" >> "$GITHUB_ENV"
          fi
          { echo "Q=$Q"; echo "Q_DIR=$ORDNER"; echo "Q_BRANCH=$ZWEIG"; } >> "$GITHUB_ENV"

      - name: Abgelehnte Einsendungen beiseitelegen
        if: env.Q_NONE != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          W="$GITHUB_WORKSPACE"; P=karte/data/feldcheck/eingang
          # Vorschläge, die ohne Merge geschlossen wurden (die letzten 20)
          gh pr list --head feldcheck-update --state closed --limit 20 --json number,mergedAt \
            -q '.[] | select(.mergedAt == null) | .number' > "$RUNNER_TEMP/abgelehnt.txt" || true
          [ -s "$RUNNER_TEMP/abgelehnt.txt" ] || { echo "Keine abgelehnten Vorschläge."; exit 0; }
          refs=""
          while read -r n; do
            git -C "$W" fetch -q --depth=1 origin "refs/pull/$n/head:refs/abgelehnt/$n" && refs="$refs refs/abgelehnt/$n"
          done < "$RUNNER_TEMP/abgelehnt.txt"
          cd "$Q"; mkdir -p "$Q_DIR/abgelehnt"
          moved=0
          for f in "$Q_DIR"/*.json; do
            [ -e "$f" ] || continue
            pub="$P/$(python3 "$W/karte/scripts/feldcheck_inbox.py" name "$f" $Q_ANON)"   # Name der Datei im öffentlichen Repo
            git -C "$W" cat-file -e "main:$pub" 2>/dev/null && continue               # in main = freigegeben
            for r in $refs; do
              if git -C "$W" cat-file -e "$r:$pub" 2>/dev/null; then                   # steckte in einem abgelehnten Vorschlag
                git mv "$f" "$Q_DIR/abgelehnt/"; moved=$((moved + 1)); break
              fi
            done
          done
          echo "Beiseitegelegt: $moved"
          [ "$moved" -gt 0 ] || exit 0
          git commit -q -m "Abgelehnte Feldcheck-Einsendungen beiseitegelegt ($moved)"
          # Helfer können gleichzeitig senden: dann neu aufsetzen und noch einmal
          for i in 1 2 3 4 5; do
            git push -q origin "HEAD:$Q_BRANCH" && exit 0
            sleep $((i * 3)); git fetch -q --depth=50 origin "$Q_BRANCH" && git rebase -q FETCH_HEAD
          done
          echo "::error::Briefkasten ($Q_BRANCH) konnte nicht aktualisiert werden"; exit 1

      - name: Neue Einsendungen holen
        id: neu
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          L="$RUNNER_TEMP/neu.txt"; : > "$L"
          [ "${Q_NONE:-}" != 1 ] || { echo "keine=1" >> "$GITHUB_OUTPUT"; exit 0; }
          # alles übernehmen, auch abgelehnt/ (damit main abgelehnte Einträge kennt und die App aufräumen kann);
          # aus einem privaten Eingangs-Repo nur mit Kürzeln statt Namen. Neu sind Dateien direkt in eingang/, die main nicht hat.
          python3 karte/scripts/feldcheck_inbox.py import "$Q/$Q_DIR" karte/data/feldcheck/eingang $Q_ANON
          git add -A karte/data/feldcheck/eingang
          git status --porcelain --untracked-files=all -- karte/data/feldcheck/eingang | awk '{print $NF}' \
            | grep '\.json$' | grep -v '/abgelehnt/' > "$L" || true
          echo "Neue Einsendungen:"; cat "$L"
          # nichts tun, wenn alle schon im offenen Vorschlag stecken
          if [ -s "$L" ] && [ "$(gh pr view feldcheck-update --json state -q .state 2>/dev/null || true)" = OPEN ] \
             && git fetch -q --depth=1 origin feldcheck-update; then
            alle=1; while read -r f; do git cat-file -e "FETCH_HEAD:$f" 2>/dev/null || alle=0; done < "$L"
            if [ "$alle" = 1 ]; then echo "Schon im offenen Vorschlag."; : > "$L"; fi
          fi
          if [ -s "$L" ]; then echo "keine=0" >> "$GITHUB_OUTPUT"; else echo "keine=1" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-python@v5
        if: steps.neu.outputs.keine == '0'
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: karte/requirements.lock

      - name: Pakete
        if: steps.neu.outputs.keine == '0'
        run: pip install -r karte/requirements.lock

      - name: Karten, Liste und App neu berechnen
        if: steps.neu.outputs.keine == '0'
        run: cd karte && JOBS=4 ./run_all.sh

      - name: Bericht und Vorschaubilder
        if: steps.neu.outputs.keine == '0'
        run: |
          python karte/scripts/feldcheck_report.py "$RUNNER_TEMP/neu.txt" "${{ github.run_id }}" "$RUNNER_TEMP/titel.txt" > "$RUNNER_TEMP/body.md"
          cat "$RUNNER_TEMP/titel.txt"

      - name: Vorschaubilder ablegen (eigener Zweig "vorschau", nicht in main)
        if: steps.neu.outputs.keine == '0'
        run: |
          set -euo pipefail
          ls karte/out/vorschau/*.jpg >/dev/null 2>&1 || { echo "Keine Vorschaubilder."; exit 0; }
          git worktree add -q --orphan -b vorschau-lauf "$RUNNER_TEMP/vorschau"
          cp karte/out/vorschau/*.jpg "$RUNNER_TEMP/vorschau/"
          cd "$RUNNER_TEMP/vorschau"
          git add -A && git commit -q -m "Vorschau zu Lauf ${{ github.run_id }}" && git push -q -f origin HEAD:vorschau

      - uses: actions/setup-node@v4
        if: steps.neu.outputs.keine == '0'
        with:
          node-version: '22'

      - name: Prüfung vor dem Vorschlag
        id: pruefung
        if: steps.neu.outputs.keine == '0'
        run: |
          set +e
          LOG="$RUNNER_TEMP/pruefung.log"
          { python -m unittest discover -s karte/tests && python karte/scripts/check.py; } > "$LOG" 2>&1; py=$?
          { npm install --no-save --no-package-lock playwright@1.56.1 && npx playwright install --with-deps chromium; } > /dev/null 2>&1
          python3 -m http.server 8000 --bind 127.0.0.1 > /dev/null 2>&1 &
          sleep 1; node karte/tests/smoke.js http://127.0.0.1:8000/index.html >> "$LOG" 2>&1; js=$?
          cat "$LOG"
          if [ $py = 0 ] && [ $js = 0 ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "ok=0" >> "$GITHUB_OUTPUT"; fi

      - name: Änderungsvorschlag anlegen
        if: steps.neu.outputs.keine == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          B="$RUNNER_TEMP/body.md"
          if [ "${{ steps.pruefung.outputs.ok }}" = 1 ]; then
            printf '\n✓ Automatische Prüfung bestanden (Regeln, Zusammenhang der Daten, App im Browser).\n' >> "$B"; ST=success
          else
            { printf '> [!WARNING]\n> **Automatische Prüfung fehlgeschlagen – bitte nicht zusammenführen.** [Protokoll](%s)\n\n```\n' "$RUN_URL"
              { grep -E 'FAIL|fehlgeschlagen|^ - |Error|error' "$RUNNER_TEMP/pruefung.log" || true; } | head -20; printf '```\n\n'; cat "$B"; } > "$B.neu"; mv "$B.neu" "$B"; ST=failure
          fi
          T="$(cat "$RUNNER_TEMP/titel.txt")"
          git switch -q -c feldcheck-update
          git add -A
          git commit -q -m "$T"
          git push -q -f origin feldcheck-update
          gh api "repos/${{ github.repository }}/statuses/$(git rev-parse HEAD)" -f state="$ST" -f context="Feldcheck-Prüfung" \
            -f description="$([ "$ST" = success ] && echo 'Prüfung bestanden' || echo 'Prüfung fehlgeschlagen')" -f target_url="$RUN_URL" > /dev/null || true
          if [ "$(gh pr view feldcheck-update --json state -q .state 2>/dev/null || true)" = "OPEN" ]; then
            gh pr edit feldcheck-update --title "$T" --body-file "$B"
            gh pr comment feldcheck-update --body "Neue Einsendung eingearbeitet – Vorschlag aktualisiert."
          else
            gh pr create --base main --head feldcheck-update --title "$T" --body-file "$B"
            gh pr edit feldcheck-update --add-reviewer "${{ github.repository_owner }}" || true
          fi
