# Feldcheck-Briefkasten: neue Einsendungen aus der App (Zweig "eingang") einarbeiten, Karten neu berechnen
# und als Änderungsvorschlag (Pull Request) zur Freigabe vorlegen.
name: Feldcheck einarbeiten

on:
  repository_dispatch:
    types: [feldcheck]          # die App meldet jede Einsendung
  workflow_dispatch:            # von Hand starten
  schedule:
    - cron: '17 4 * * *'        # täglich nachsehen, falls eine Meldung verloren ging
  pull_request:
    types: [closed]             # abgelehnte Vorschläge beiseitelegen
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: feldcheck
  cancel-in-progress: false

jobs:
  einarbeiten:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Neue Einsendungen holen
        id: neu
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --depth=1 origin eingang || { echo "keine=1" >> "$GITHUB_OUTPUT"; exit 0; }
          git checkout origin/eingang -- karte/data/feldcheck/eingang/ 2>/dev/null || true
          git rm -r -q --cached --ignore-unmatch karte/data/feldcheck/eingang/abgelehnt >/dev/null
          rm -rf karte/data/feldcheck/eingang/abgelehnt
          git status --porcelain --untracked-files=all -- karte/data/feldcheck/eingang | awk '{print $NF}' | grep '\.json$' > /tmp/neu.txt || true
          echo "Neue Einsendungen:"; cat /tmp/neu.txt
          # täglicher Lauf: nichts tun, wenn alle Einsendungen schon im offenen Vorschlag stecken
          if [ -s /tmp/neu.txt ] && [ "${{ github.event_name }}" = schedule ] \
             && [ "$(gh pr view feldcheck-update --json state -q .state 2>/dev/null)" = OPEN ] \
             && git fetch -q --depth=1 origin feldcheck-update; then
            alle=1; while read -r f; do git cat-file -e "origin/feldcheck-update:$f" 2>/dev/null || alle=0; done < /tmp/neu.txt
            if [ "$alle" = 1 ]; then echo "Schon im offenen Vorschlag."; : > /tmp/neu.txt; fi
          fi
          if [ -s /tmp/neu.txt ]; then echo "keine=0" >> "$GITHUB_OUTPUT"; else echo "keine=1" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-python@v5
        if: steps.neu.outputs.keine == '0'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: karte/requirements.txt

      - name: Pakete
        if: steps.neu.outputs.keine == '0'
        run: pip install -r karte/requirements.txt

      - name: Karten, Liste und App neu berechnen
        if: steps.neu.outputs.keine == '0'
        run: cd karte && JOBS=4 ./run_all.sh

      - name: Bericht und Vorschaubilder
        if: steps.neu.outputs.keine == '0'
        run: python karte/scripts/feldcheck_report.py /tmp/neu.txt "${{ github.run_id }}" > /tmp/body.md && cat /tmp/titel.txt

      - name: Änderungsvorschlag anlegen
        if: steps.neu.outputs.keine == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Feldcheck-Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c feldcheck-update
          git add -A
          git commit -q -m "$(cat /tmp/titel.txt)"
          git push -f origin feldcheck-update
          if [ "$(gh pr view feldcheck-update --json state -q .state 2>/dev/null)" = "OPEN" ]; then
            gh pr edit feldcheck-update --title "$(cat /tmp/titel.txt)" --body-file /tmp/body.md
            gh pr comment feldcheck-update --body "Neue Einsendung eingearbeitet – Vorschlag aktualisiert."
          else
            gh pr create --base main --head feldcheck-update --title "$(cat /tmp/titel.txt)" --body-file /tmp/body.md
            gh pr edit feldcheck-update --add-reviewer "${{ github.repository_owner }}" || true
          fi

  abgelehnt:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == false && github.event.pull_request.head.ref == 'feldcheck-update'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eingang
      - name: Abgelehnte Einsendungen beiseitelegen
        env:
          GH_TOKEN: ${{ github.token }}
          KOPF: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch -q --depth=1 origin main "$KOPF"
          mkdir -p karte/data/feldcheck/eingang/abgelehnt
          rest=0
          for f in karte/data/feldcheck/eingang/*.json; do
            [ -e "$f" ] || continue
            git cat-file -e "origin/main:$f" 2>/dev/null && continue               # schon übernommen
            if git cat-file -e "$KOPF:$f" 2>/dev/null; then                        # war im abgelehnten Vorschlag
              git mv "$f" karte/data/feldcheck/eingang/abgelehnt/
            else rest=1; fi                                                       # kam später, noch nicht geprüft
          done
          git config user.name "Feldcheck-Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git commit -q -m "Abgelehnte Feldcheck-Einsendungen beiseitegelegt"; then git push origin eingang; fi
          if [ "$rest" = 1 ]; then gh workflow run feldcheck.yml --ref main; fi
