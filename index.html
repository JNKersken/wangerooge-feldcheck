#app{position:fixed;inset:0}
#map{position:absolute;inset:0;background:var(--paper);z-index:1}
.leaflet-container{background:var(--paper);font-family:var(--f-ui)}

/* glass material: translucent fill, blur of the map behind, a bright top edge and a soft lift */
.glass{background:linear-gradient(180deg,var(--sheen),transparent 46%),var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:.5px solid var(--edge);box-shadow:var(--lift),inset 0 .5px 0 var(--edge)}
.glass-strong{background:linear-gradient(180deg,var(--sheen),transparent 30%),var(--glass-strong);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:.5px solid var(--edge);box-shadow:var(--lift),inset 0 .5px 0 var(--edge)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass,.glass-strong{background:var(--glass-strong)}:root{--glass:rgba(246,246,248,.96);--glass-strong:rgba(248,248,250,.97)}}

/* top bar */
.top{position:fixed;z-index:12;top:calc(var(--sat) + 8px);left:10px;right:10px;display:flex;gap:8px;align-items:center;pointer-events:none}
.top > *{pointer-events:auto}
.brandcap{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px 0 16px;border-radius:24px;min-width:0;overflow:hidden}
.brand{font:700 19px/1 var(--f-round);letter-spacing:-.01em;white-space:nowrap}
.prog{display:flex;align-items:center;gap:6px;color:var(--ink);opacity:.72;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.pring{width:18px;height:18px;transform:rotate(-90deg)}
.pring circle{fill:none;stroke-width:3.2}
.pring .pt{stroke:var(--fill-2)} .pring .pf{stroke:var(--ok);stroke-linecap:round;transition:stroke-dasharray .4s}
.top .sp{flex:1}
.tools{display:flex;align-items:center;height:48px;padding:0 3px;border-radius:24px}
.tb{display:flex;align-items:center;justify-content:center;gap:5px;min-width:42px;height:42px;padding:0 9px;border:0;border-radius:21px;background:transparent;color:var(--ink);font:600 14px var(--f-ui)}
.tb svg{width:21px;height:21px;flex:none}
.tb:active{background:var(--fill)}
.tb .tl{white-space:nowrap;font-size:13px}
.tb .tl:empty{display:none}
.gpsb[data-st="on"]{color:var(--sel)} .gpsb[data-st="wait"]{color:var(--sel);opacity:.7} .gpsb[data-st="err"]{color:var(--bad)}
.gpsb[data-st="on"] .tl{font-variant-numeric:tabular-nums}
.gpsb[data-st="on"] svg path{fill:currentColor}
@media (max-width:419px){.pring{display:none}.brandcap{padding:0 14px}}
@media (max-width:379px){.pring{display:block}.prog b{display:none}}

/* buttons */
button{font:inherit;color:inherit;cursor:pointer}
.ib{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 16px;border:0;border-radius:22px;background:var(--fill);color:var(--ink);font:600 15px var(--f-ui);white-space:nowrap;text-align:center}
.ib:active{background:var(--fill-2)}
.ib:disabled{opacity:.45}
.ib svg{width:19px;height:19px;flex:none}
.ib.pri,.big{background:var(--accent);color:var(--accent-ink)}
.ib.pri:active{filter:brightness(.92)}
.ib.icon{width:44px;padding:0;flex:0 0 auto}
.ib.grow{flex:1 1 auto}
.big{width:100%;min-height:50px;border:0;border-radius:25px;font:600 16px var(--f-ui)}
.big:disabled{opacity:.6}
.ib:focus-visible,.act:focus-visible,.chip:focus-visible,.tb:focus-visible,.li:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .ib{flex:1 1 auto}
.row .ib.icon{flex:0 0 auto}

/* mode banner (tap a position, draw a path) */
#banner{position:fixed;top:calc(var(--sat) + 66px);left:50%;transform:translateX(-50%);z-index:20;background:var(--accent);color:#fff;padding:8px 8px 8px 16px;border-radius:22px;font-weight:600;display:flex;gap:10px;align-items:center;box-shadow:var(--lift);max-width:calc(100% - 24px)}
#banner button{background:rgba(255,255,255,.22);border:0;border-radius:16px;padding:6px 12px;color:#fff;font-weight:600;font-size:14px}

/* bottom card (side card on wide screens) */
.sheet{position:fixed;z-index:10;left:10px;right:10px;bottom:calc(var(--sab) + 10px);border-radius:28px;padding:16px;max-height:min(60vh,600px);overflow:auto;overscroll-behavior:contain;display:grid;gap:12px}
@media (min-width:820px){.sheet{left:auto;right:12px;top:calc(var(--sat) + 70px);bottom:12px;width:380px;max-height:none;align-content:start}}
.ihead{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-width:0}
.ihead .cat{font-weight:600;color:var(--ink)}
.ihead .id{margin-left:auto;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;height:22px;border-radius:11px;padding:0 9px;font-size:12px;font-weight:700}
.p-open{background:var(--fill);color:var(--ink)} .p-ok{background:var(--ok);color:#fff} .p-bad{background:var(--bad);color:#fff} .p-move{background:var(--move);color:#231500} .p-sure{background:var(--sure);color:#fff} .p-new{background:var(--sel);color:#fff} .p-rec{background:var(--bad);color:#fff}
h2{margin:0;font-size:21px;line-height:1.2;font-weight:700;letter-spacing:-.015em;text-wrap:balance}
.find{margin:0;font-size:15.5px;line-height:1.4}
.facts{display:grid;gap:6px}
.fact{display:grid;grid-template-columns:18px 1fr;gap:8px;align-items:start;font-size:13.5px;line-height:1.35;color:var(--muted)}
.fact svg{width:16px;height:16px;margin-top:1px;color:var(--muted)}
.fact.zone,.fact.zone svg{color:#2f8a4a}
.meta{color:var(--muted);font-size:13.5px;line-height:1.4;margin:0}
.ii{display:inline-grid;place-items:center;width:1.5em;height:1.25em;vertical-align:-.28em;border-radius:.45em;background:var(--fill);color:var(--ink)}
.ii svg{width:.95em;height:.95em}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

input[type=text],input[type=password],textarea{width:100%;box-sizing:border-box;font:16px/1.35 var(--f-ui);color:var(--ink);background:var(--field);border:0;border-radius:14px;padding:12px 14px;outline:none}

textarea{min-height:46px;resize:vertical}
::placeholder{color:var(--muted);opacity:.85}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:0;background:var(--fill);border-radius:17px;min-height:34px;padding:0 13px;font:500 14px var(--f-ui);color:var(--ink)}

  db.collection('pruefung').onSnapshot((snap) => {

      const a = pending[id], b = verdicts[id];

function sentText(){ const s = LS.get('fc_sent', null); return s ? `Zuletzt gesendet am ${new Date(s.t).toLocaleString('de-DE', {dateStyle: 'short', timeStyle: 'short'})}.` : 'Noch nichts gesendet.'; }
function b64utf8(str){ const b = new TextEncoder().encode(str); let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); }
async function sendBox(res){
  const st = $('sendSt'), btn = $('bSend'); const nv = Object.keys(res.verdicts).length, nn = Object.keys(res.neu).length;
  if (!nv && !nn) { st.textContent = 'Noch nichts zum Senden.'; return; }
  btn.disabled = true; st.className = 'status'; st.textContent = 'Sende …';
  const who = (box.name || 'ohne-name'), slug = who.toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'helfer';
  const now = new Date(), stamp = now.toISOString().slice(0, 16).replace(/[:T]/g, '-');
  const path = `${GH.dir}/${stamp}_${slug}_${Math.random().toString(36).slice(2, 6)}.json`;
  const body = JSON.stringify({name: who, gesendet: now.toISOString(), geraet: navigator.userAgent.slice(0, 120), verdicts: res.verdicts, neu: res.neu}, null, 1);
  try {
    const r = await fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${path}`, {method: 'PUT',
      headers: {'Authorization': 'Bearer ' + box.key, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'},
      body: JSON.stringify({message: `Feldcheck von ${who}: ${nv} Bewertungen, ${nn} neue Objekte`, content: b64utf8(body), branch: GH.branch})});
    if (r.status === 201 || r.status === 200) {
      LS.set('fc_sent', {t: Date.now(), nv, nn});
      // wake the GitHub Action (runs from main); if this fails the daily run picks the file up
      fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}/dispatches`, {method: 'POST', headers: {'Authorization': 'Bearer ' + box.key, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'},
        body: JSON.stringify({event_type: 'feldcheck', client_payload: {datei: path}})}).catch(() => {});
      st.textContent = 'Gesendet. Nach der Freigabe erscheint alles in Karte und App.';
    }
    else if (r.status === 401) { st.className = 'status warn'; st.textContent = 'Schlüssel ungültig oder abgelaufen. Neuen Einladungslink anfordern.'; }
    else if (r.status === 403 || r.status === 404) { st.className = 'status warn'; st.textContent = `Keine Berechtigung (Fehler ${r.status}). Schlüssel prüfen lassen.`; }
    else { st.className = 'status warn'; st.textContent = `Senden fehlgeschlagen (Fehler ${r.status}). Später erneut versuchen.`; }
  } catch(e) { st.className = 'status warn'; st.textContent = 'Kein Netz. Einträge bleiben gespeichert – später senden.'; }
  btn.disabled = false;
}

function loadScript(src){ return new Promise((res, rej) => { if (document.querySelector(`script[src="${src}"]`)) return res(); const el = document.createElement('script'); el.src = src; el.onload = res; el.onerror = rej; document.head.appendChild(el); }); }
const hideSel = (keys) => keys.map(k => `[id^="L-${k}-"]`).join(',');
function savePdfSel(){ LS.set('fc_pdfSel', pdfSel); }
async function renderPdfPanel(){
  const P = $('pdfPanel');
  P.innerHTML = '<p class="meta">Lade Kartendaten …</p>';
  let M; try { M = await kartenMeta(); } catch(e) { P.innerHTML = '<p class="status warn">Kartendaten nicht erreichbar – einmal mit Netz öffnen.</p>'; return; }
  pdfSel.sheets = pdfSel.sheets.filter(id => M.sheets.some(s => s.id === id)); if (!pdfSel.sheets.length) pdfSel.sheets = [M.sheets[0].id];
  const groups = [...new Set(M.layers.map(l => l.group))];
  P.innerHTML = `<div class="phead"><h2>Karte als PDF</h2><button class="x" id="pdfClose" type="button" aria-label="Schließen">${svgI('x')}</button></div>
    <p class="meta" style="margin-top:-8px">Stand ${esc(M.stand.split('-').reverse().join('.'))}</p>
    <p class="sub">Blätter</p>
    <div class="chips">${M.sheets.map(s => `<button class="chip" type="button" data-sh="${s.id}" aria-pressed="${pdfSel.sheets.includes(s.id)}">${esc(s.title)}</button>`).join('')}</div>
    <p class="sub">Druck</p>
    <div class="chips"><button class="chip" type="button" data-md="color" aria-pressed="${pdfSel.mode === 'color'}">Farbe</button><button class="chip" type="button" data-md="bw" aria-pressed="${pdfSel.mode === 'bw'}">Schwarzweiß</button></div>
    <div class="pvwrap"><p class="sub">Vorschau <span id="pvName" style="font-weight:400"></span></p><div id="pv"><p class="meta">…</p></div></div><style id="pvStyle"></style>
    ${groups.map(g => `<div class="pgrp"><p class="sub">${esc(g)}</p><div class="chips">${M.layers.filter(l => l.group === g).map(l => `<button class="chip" type="button" data-ly="${l.key}" aria-pressed="${!pdfSel.off.includes(l.key)}">${esc(l.label)}</button>`).join('')}</div></div>`).join('')}
    <div class="row"><button class="ib" id="lyAll" type="button">Alle Ebenen an</button><button class="ib" id="lyMin" type="button">Nur Wege &amp; Punkte</button></div>
    <button class="big" id="pdfGo" type="button">PDF erzeugen</button>
    <p class="status" id="pdfSt">Ausgeblendete Ebenen fehlen auch in Lupen und Legende.</p>`;
  $('pdfClose').onclick = () => openPanel(null);
  P.querySelectorAll('[data-sh]').forEach(b => b.onclick = () => { const id = b.dataset.sh; const on = pdfSel.sheets.includes(id);
    if (on && pdfSel.sheets.length === 1) return; pdfSel.sheets = on ? pdfSel.sheets.filter(x => x !== id) : M.sheets.map(s => s.id).filter(x => x === id || pdfSel.sheets.includes(x));
    b.setAttribute('aria-pressed', !on); savePdfSel(); preview(); });
  P.querySelectorAll('[data-md]').forEach(b => b.onclick = () => { pdfSel.mode = b.dataset.md; P.querySelectorAll('[data-md]').forEach(x => x.setAttribute('aria-pressed', x === b)); savePdfSel(); preview(); });
  P.querySelectorAll('[data-ly]').forEach(b => b.onclick = () => { const k = b.dataset.ly; pdfSel.off = pdfSel.off.includes(k) ? pdfSel.off.filter(x => x !== k) : pdfSel.off.concat(k);
    b.setAttribute('aria-pressed', !pdfSel.off.includes(k)); savePdfSel(); applyHide(); });
  $('lyAll').onclick = () => { pdfSel.off = []; savePdfSel(); renderPdfPanel(); };
  $('lyMin').onclick = () => { pdfSel.off = ['contours', 'summits', 'steep', 'pits', 'veg', 'sand', 'open', 'small', 'facilities', 'north']; savePdfSel(); renderPdfPanel(); };
  $('pdfGo').onclick = makePdf;
  preview();
}
function applyHide(){ const st = $('pvStyle'); if (st) st.textContent = pdfSel.off.length ? `#pv :is(${hideSel(pdfSel.off)}){display:none}` : ''; }
async function preview(){
  const M = await kartenMeta(), sh = M.sheets.find(s => s.id === pdfSel.sheets[0]), url = sh.files[pdfSel.mode] || sh.files.color, tok = ++pvToken;
  $('pvName').textContent = '· ' + sh.title; $('pv').innerHTML = '<p class="meta">Lade Vorschau …</p>'; applyHide();
  try { const t = await svgText(url); if (tok !== pvToken) return; $('pv').innerHTML = t.replace(/^[\s\S]*?(<svg)/, '$1'); }
  catch(e) { $('pv').innerHTML = '<p class="status warn">Vorschau nicht geladen – Netz prüfen.</p>'; }
}
async function makePdf(){
  const M = await kartenMeta(), btn = $('pdfGo'), st = $('pdfSt'); btn.disabled = true;
  try {
    st.textContent = 'Lade PDF-Werkzeug …'; await loadScript('lib/jspdf.umd.min.js'); await loadScript('lib/svg2pdf.umd.min.js');
    const host = document.createElement('div'); host.style.cssText = 'position:fixed;left:-99999px;top:0;width:10px;height:10px;overflow:hidden'; document.body.appendChild(host);
    let pdf = null; const list = M.sheets.filter(s => pdfSel.sheets.includes(s.id));
    for (let i = 0; i < list.length; i++){
      const sh = list[i]; st.textContent = `Erzeuge ${sh.title} (${i + 1}/${list.length}) …`;
      const txt = await svgText(sh.files[pdfSel.mode] || sh.files.color);
      const svg = new DOMParser().parseFromString(txt, 'image/svg+xml').documentElement;
      if (pdfSel.off.length) svg.querySelectorAll(hideSel(pdfSel.off)).forEach(e => {   // keep shared <defs> (glyphs, markers) that other groups reuse
        e.querySelectorAll('defs').forEach(d => svg.appendChild(d)); e.remove(); });
      host.appendChild(svg);
      const Wd = parseFloat(svg.getAttribute('width')), Hd = parseFloat(svg.getAttribute('height')), ori = Wd > Hd ? 'landscape' : 'portrait';
      if (!pdf) pdf = new window.jspdf.jsPDF({orientation: ori, unit: 'pt', format: [Wd, Hd], compress: true}); else pdf.addPage([Wd, Hd], ori);
      await pdf.svg(svg, {x: 0, y: 0, width: Wd, height: Hd}); host.removeChild(svg);
      await new Promise(r => setTimeout(r, 30));
    }
    host.remove();
    const off = pdfSel.off.length ? '_ohne-' + pdfSel.off.length + '-Ebenen' : '';
    const name = `Wangerooge_West_${list.length === M.sheets.length ? 'alle-Blaetter' : list.map(s => s.id.replace('detail_', '')).join('-')}_${pdfSel.mode === 'bw' ? 'SW' : 'Farbe'}${off}.pdf`;
    const file = new File([pdf.output('blob')], name, {type: 'application/pdf'});
    st.textContent = `Fertig: ${name} (${(file.size / 1048576).toFixed(1)} MB)`;
    try { if (navigator.canShare && navigator.canShare({files: [file]})) { await navigator.share({files: [file], title: name}); btn.disabled = false; return; } } catch(e) { if (e && e.name === 'AbortError') { btn.disabled = false; return; } }
    const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  } catch(e) { st.textContent = 'PDF konnte nicht erzeugt werden: ' + (e && e.message || e); st.className = 'status warn'; }
  btn.disabled = false;
}


// ---------- Einführung (tour): spotlight on the controls, step by step; the highlighted control stays usable ----------
let tour = null;
const TOUR_STEPS = () => [
  {t: 'Feldcheck', x: 'Prüfe vor Ort, ob die Landmarken der OL-Karte stimmen – und trag ein, was fehlt.'},
  {sel: '#map', t: 'Die Karte', x: 'Weiß = offen. Dunkel = schon sicher. Nach dem Prüfen: grün stimmt, rot fehlt, orange woanders, blau neu.', pad: -12},
  IS_APP && {sel: '#btnGps', t: 'GPS', x: 'Zeigt dich als blauen Punkt. Mit [follow] darunter folgt die Karte dir.', hint: 'Tippe jetzt auf [loc].', tap: true},
  {sel: '#bNext', t: 'Nächstes offenes Objekt', x: 'Springt zum nächsten offenen Punkt. Oder tippe einfach einen Marker an.', hint: 'Probier es aus.', tap: true},
  {sel: '#sheet', t: 'Prüfen', before: () => { if (!selId) nextOpen(); }, x: 'Oben steht, was du suchst. Dann Stimmt, Fehlt oder Woanders.'},
  {sel: '#bAdd', before: () => { if (selId) { selId = null; redrawSel(); renderSheet(); } }, t: 'Neu erfassen', x: 'Mit [plus] trägst du ein, was auf der Karte fehlt – auch Pfade per GPS.'},
  {sel: '#btnList', t: 'Liste', x: '[list] zeigt alle offenen Punkte, nach Entfernung sortiert.'},
  {sel: '#btnMenu', t: 'Menü', x: IS_APP ? '[more] öffnet das Menü: Ergebnis senden, Karte als PDF, offline speichern, Filter.' : '[more] öffnet das Menü: Ergebnis, Filter und Legende.'},
  {t: 'Fertig', x: (IS_APP ? 'Am Ende im Menü [more] auf „Ans Kartenteam senden“ tippen. Bis dahin bleibt alles auf dem Handy, auch offline.' : 'Deine Einträge landen im Speicher dieser Seite.') + ' Diese Einführung gibt es jederzeit über [help].', last: true},
].filter(Boolean);
function startTour(){
  endTour(); openPanel(null);
  const steps = TOUR_STEPS().filter(st => !st.sel || (document.querySelector(st.sel) && !document.querySelector(st.sel).hidden) || st.before);
  const el = document.createElement('div'); el.className = 'tour'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true');
  el.innerHTML = '<div class="blk"></div><div class="blk"></div><div class="blk"></div><div class="blk"></div><div class="ring"></div><div class="card glass-strong" aria-live="polite"></div>';
  document.body.appendChild(el);
  tour = {el, steps, i: 0, tapOff: null};
  window.addEventListener('resize', placeTour); showStep(0);
}
function endTour(){
  if (!tour) return;
  if (tour.tapOff) tour.tapOff();
  window.removeEventListener('resize', placeTour); tour.el.remove(); tour = null;
}
function showStep(i){
  if (!tour) return;
  if (tour.tapOff) { tour.tapOff(); tour.tapOff = null; }
  if (i >= tour.steps.length) return endTour();
  tour.i = i; const st = tour.steps[i];
  if (st.before) st.before();
  const off = LS.get('fc_tour_off', false), n = tour.steps.length;
  const card = tour.el.querySelector('.card');
  card.innerHTML = `<div class="tnav"><div class="dots">${tour.steps.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('')}</div><span class="sp"></span><button class="skip" type="button" id="tSkip">${st.last ? '' : 'Überspringen'}</button></div>
    <h3>${esc(st.t)}</h3><p>${ti(st.x)}</p>${st.hint ? `<div class="hint">${ti(st.hint)}</div>` : ''}
    <label><input type="checkbox" id="tOff" ${off ? 'checked' : ''}> Nicht mehr beim Start zeigen</label>
    <div class="tnav">${i ? '<button class="ib" type="button" id="tBack" style="flex:0 0 auto">Zurück</button>' : ''}<span class="sp"></span>
      <button class="ib pri" type="button" id="tNext" style="flex:0 0 auto">${st.last ? 'Los geht’s' : (i ? 'Weiter' : 'Kurz zeigen')}</button></div>`;
  card.querySelector('#tOff').onchange = (e) => LS.set('fc_tour_off', e.target.checked);
  card.querySelector('#tNext').onclick = () => showStep(i + 1);
  if (card.querySelector('#tBack')) card.querySelector('#tBack').onclick = () => showStep(i - 1);
  if (!st.last) card.querySelector('#tSkip').onclick = endTour; else card.querySelector('#tSkip').remove();
  if (st.tap && st.sel) {   // tapping the highlighted control does its job and moves the tour on
    const t = document.querySelector(st.sel), h = () => setTimeout(() => showStep(i + 1), 350);
    if (t) { t.addEventListener('click', h); tour.tapOff = () => t.removeEventListener('click', h); }
  }
  placeTour(); setTimeout(placeTour, 120); setTimeout(placeTour, 400);
  card.querySelector('#tNext').focus({preventScroll: true});
}
function placeTour(){
  if (!tour) return;
  const st = tour.steps[tour.i], [b0, b1, b2, b3] = tour.el.querySelectorAll('.blk'), ring = tour.el.querySelector('.ring'), card = tour.el.querySelector('.card');
  const W_ = window.innerWidth, H_ = window.innerHeight, t = st.sel && document.querySelector(st.sel);
  const set = (e, l, tp, w, h) => Object.assign(e.style, {left: l + 'px', top: tp + 'px', width: Math.max(0, w) + 'px', height: Math.max(0, h) + 'px'});
  if (!t || !t.offsetWidth) {   // no target: dim everything, card in the middle
    set(b0, 0, 0, W_, H_); [b1, b2, b3].forEach(b => set(b, 0, 0, 0, 0)); ring.style.display = 'none';
    Object.assign(card.style, {top: Math.max(16, (H_ - card.offsetHeight) / 2) + 'px', bottom: 'auto'}); return;
  }
  const r = t.getBoundingClientRect(), pd = st.pad === undefined ? 6 : st.pad;
  const L_ = Math.max(0, r.left - pd), T_ = Math.max(0, r.top - pd), R_ = Math.min(W_, r.right + pd), B_ = Math.min(H_, r.bottom + pd);
  set(b0, 0, 0, W_, T_); set(b1, 0, B_, W_, H_ - B_); set(b2, 0, T_, L_, B_ - T_); set(b3, R_, T_, W_ - R_, B_ - T_);
  ring.style.display = ''; set(ring, L_, T_, R_ - L_, B_ - T_);
  const ch = card.offsetHeight, below = H_ - B_, above = T_;
  if (below >= ch + 24) Object.assign(card.style, {top: (B_ + 14) + 'px', bottom: 'auto'});
  else if (above >= ch + 24) Object.assign(card.style, {top: (T_ - ch - 14) + 'px', bottom: 'auto'});
  else Object.assign(card.style, {top: Math.max(12, (H_ - ch) / 2) + 'px', bottom: 'auto'});   // big target (map): card floats over it
}

fetch('data.json').then(r => r.json()).then(d => {
  DATA = d; DATA.items.forEach(i => byId[i.id] = i); DATA.paths.forEach(p => byId[p.id] = p);
  redrawAll(); drawMe(); renderSheet(); initStore();
  if (!LS.get('fc_tour_off', false)) setTimeout(startTour, 700);
}).catch(() => { $('sheet').innerHTML = '<p class="status warn">Die Objektliste konnte nicht geladen werden. Bitte Seite neu laden.</p>'; });
})();
</script>
