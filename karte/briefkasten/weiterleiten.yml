# Gehört in das private Eingangs-Repo als .github/workflows/weiterleiten.yml (siehe karte/BRIEFKASTEN.md, Schritt 7).
# Startet nach jeder Einsendung sofort den Lauf im Karten-Repo – ohne diese Datei kommt sie mit dem täglichen Lauf.
name: An die Karte melden

on:
  push:
    branches: [main]
    paths: ['eingang/*.json']

permissions: {}

jobs:
  melden:
    runs-on: ubuntu-latest
    steps:
      - name: Feldcheck-Lauf im Karten-Repo starten
        env:
          T: ${{ secrets.KARTE_TOKEN }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $T" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/JNKersken/wangerooge-feldcheck/actions/workflows/feldcheck.yml/dispatches \
            -d '{"ref":"main"}'
