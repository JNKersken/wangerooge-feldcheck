<title>Feldcheck Wangerooge West</title>
<style>
/* Feldcheck – the map is the screen; controls float above it as glass (iOS "Liquid Glass"): a top bar, a bottom card for the selected object, sheets for list and menu.

:root{

  --paper:#fffdf7; --panel:var(--glass-strong); --chip:var(--fill); --line:var(--hair);
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,"Segoe UI",Roboto,sans-serif;
  --f-round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --blur:saturate(180%) blur(24px);
  --lift:0 12px 32px rgba(0,0,0,.16),0 2px 6px rgba(0,0,0,.08);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --solid:#f6f6f8; --r:18px; --tint:rgba(208,23,108,.09); --tint-edge:rgba(208,23,108,.3); --accent-text:#b3105b; --btn-in:rgba(255,255,255,.88);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#f5f5f7;--muted:#a1a1a6;--hair:rgba(255,255,255,.12);--glass:rgba(34,34,38,.76);--sel:#3b9cff;--glass-strong:rgba(28,28,32,.86);--edge:rgba(255,255,255,.16);--sheen:rgba(255,255,255,.08);--fill:rgba(120,120,128,.26);--fill-2:rgba(120,120,128,.38);--field:rgba(120,120,128,.22);--accent:#e3257c;--lift:0 12px 32px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3);--tint:rgba(255,80,150,.2);--tint-edge:rgba(255,80,150,.38);--accent-text:#ff7ab0;--btn-in:rgba(255,255,255,.1);--solid:#26262a;color-scheme:dark}}

#app{position:fixed;inset:0}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass,.glass-strong{background:var(--glass-strong)}:root{--glass:rgba(246,246,248,.96);--glass-strong:rgba(248,248,250,.97)}}

  .leaflet-right{right:392px}}

.phead{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:10px;margin:0 -16px;padding:14px 12px 10px 18px;background:var(--solid);box-shadow:0 .5px 0 var(--hair)}

<script>
(() => {
const IS_APP = /*ISAPP*/false;   // standalone web app (own domain): real GPS, offline cache, file export
const X0 = 423750, Y1 = 5961650, W = 3400, H = 2800;
// WGS84 -> UTM zone 32N (ETRS89/UTM32, EPSG:25832; sub-metre agreement, far below phone GPS accuracy)
function toUTM(lat, lon){
  const a = 6378137, f = 1 / 298.257222101, k0 = 0.9996, e2 = f * (2 - f), ep2 = e2 / (1 - e2), d = Math.PI / 180;
  const phi = lat * d, A = Math.cos(phi) * (lon - 9) * d, sn = Math.sin(phi), N = a / Math.sqrt(1 - e2 * sn * sn), T = Math.tan(phi) ** 2, C = ep2 * Math.cos(phi) ** 2;
  const M = a * ((1 - e2 / 4 - 3 * e2 * e2 / 64 - 5 * e2 ** 3 / 256) * phi - (3 * e2 / 8 + 3 * e2 * e2 / 32 + 45 * e2 ** 3 / 1024) * Math.sin(2 * phi)
          + (15 * e2 * e2 / 256 + 45 * e2 ** 3 / 1024) * Math.sin(4 * phi) - (35 * e2 ** 3 / 3072) * Math.sin(6 * phi));
  const E = 500000 + k0 * N * (A + (1 - T + C) * A ** 3 / 6 + (5 - 18 * T + T * T + 72 * C - 58 * ep2) * A ** 5 / 120);

  return [Math.round(E * 10) / 10, Math.round(Nn * 10) / 10];
}
const HEAD_CORR = 4.4;   // magnetic -> grid north on Wangerooge: declination ~+3.5° plus grid convergence ~+0.9°
const GRID_CORR = 0.9;   // true (GPS course) -> grid north
const ll = (e, n) => L.latLng(n - Y1, e - X0);
const en = (p) => [Math.round((p.lng + X0) * 10) / 10, Math.round((p.lat + Y1) * 10) / 10];
const $ = (id) => document.getElementById(id);

  const u = unsent(), nv = Object.keys(u.verdicts).length, nn = Object.keys(u.neu).length;
  if (!nv && !nn) { LS.set('fc_outbox', false); if (!quiet) say('Alles gesendet.', null); return; }
  sending = true; const btn = $('bSend'); if (btn) btn.disabled = true; if (!quiet) say('Sende …', null);
  const who = (box.name || 'ohne Name'), slug = who.toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'helfer';

  const hdr = {'Authorization': 'Bearer ' + box.key, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'};
  try {

      for (const [id, x] of Object.entries(u.neu)) { sentLog.n[id] = {t: x.t, z: !!x.geloescht}; if (wd.n[id] === x.t) delete wd.n[id]; }
      LS.set('fc_sentLog', sentLog); LS.set('fc_wd', wd); LS.set('fc_outbox', false); LS.set('fc_sent', {t: Date.now(), nv, nn});
      // wake the GitHub Action (runs from main); if this fails the daily run picks the file up
      fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}/dispatches`, {method: 'POST', headers: hdr, body: JSON.stringify({event_type: 'feldcheck'})}).catch(() => {});
      say(`Gesendet (${nv + nn}). Nach der Freigabe erscheint alles in Karte und App.`, quiet ? false : null);
    }
    else if (r.status === 401) { LS.set('fc_outbox', false); say('Schlüssel ungültig oder abgelaufen. Neuen Einladungslink anfordern.', true); }
    else if (r.status === 403 || r.status === 404) { LS.set('fc_outbox', false); say(`Keine Berechtigung (Fehler ${r.status}). Schlüssel prüfen lassen.`, true); }
    else { LS.set('fc_outbox', true); say(`Senden gerade nicht möglich (Fehler ${r.status}). Wird später automatisch wiederholt.`, quiet ? null : true); }
  } catch(e) { LS.set('fc_outbox', true); say('Kein Netz. Wird automatisch gesendet, sobald Netz da ist.', quiet ? null : false); }
  sending = false; if (btn && document.body.contains(btn)) btn.disabled = !nUnsent(); updateBadge();
  const m = $('menuPanel'); if (m && !m.parentElement.hidden && !quiet) { const p_ = m.querySelector('.grp .meta'); if (p_) p_.textContent = (nUnsent() ? `${nUnsent()} noch nicht gesendet` : 'Alles gesendet') + (nWaiting() ? ` · ${nWaiting()} warten auf Freigabe` : ''); }
}

// ---------- offline: map tiles and PDF data on the phone ----------
const offCache = (p) => /^t\d/.test(p) ? TILE_CACHE : PDF_CACHE;
async function offlineMissing(){
  if (!OFFLINE || !window.caches) return null;
  const c = {[TILE_CACHE]: await caches.open(TILE_CACHE), [PDF_CACHE]: await caches.open(PDF_CACHE)}, miss = [];
  for (const p of Object.keys(OFFLINE.files)) if (!(await c[offCache(p)].match(vurl(p)))) miss.push(p);
  return miss;
}
let offBusy = false;
async function offlineSync(onProgress){   // loads what is missing; the service worker stores each file as it passes
  if (offBusy) return null; const miss = await offlineMissing(); if (!miss) return null;
  offBusy = true; let k = 0, failed = 0;
  try {
    for (let i = 0; i < miss.length; i += 6) {
      await Promise.all(miss.slice(i, i + 6).map(async (p) => {
        try { const r = await fetch(vurl(p)); if (!r.ok) { failed++; return; }
          const c = await caches.open(offCache(p)); if (!(await c.match(vurl(p)))) await c.put(vurl(p), r); }   // no service worker yet: store it here
        catch(e) { failed++; } finally { k++; }
      }));
      if (onProgress) onProgress(k, miss.length);
    }
  } finally { offBusy = false; }
  return {total: miss.length, failed};
}
function offText(miss){
  if (!miss) return 'Offline speichern geht in diesem Browser nicht.';
  const de = String(DATA && DATA.stand || '').split('-').reverse().join('.');
  return miss.length ? `Neuer Kartenstand: ${miss.length} Dateien fehlen noch – „Offline-Daten prüfen“ lädt sie.` : `Offline gespeichert und aktuell (Kartenstand ${de}).`;
}

  map.fitBounds(L.latLngBounds(ll(b[0], b[1]), ll(b[2], b[3])), {paddingTopLeft: [v.l + 12, v.t + 12], paddingBottomRight: [window.innerWidth - v.r + 12, window.innerHeight - v.b + 12]});
}

// ---------- Karte als PDF (web app): layered SVGs from the map pipeline, layers switchable, PDF built on the phone ----------

function applyHide(){ const st = $('pvStyle'); if (st) st.textContent = pdfSel.off.length ? `#pv :is(${hideSel(pdfSel.off)}){display:none}` : ''; }
async function preview(){

async function makePdf(){

// ---------- Einführung (tour): spotlight on the controls, step by step; the highlighted control stays usable ----------
let tour = null;
const TOUR_STEPS = () => [
  {t: 'Feldcheck', x: 'Prüfe vor Ort, ob die Landmarken der OL-Karte stimmen – und trag ein, was fehlt.'},
  {sel: '#map', t: 'Die Karte', x: 'Weiß = offen. Dunkel = schon sicher. Nach dem Prüfen: grün stimmt, rot fehlt, orange woanders, blau neu.', pad: -12},
  IS_APP && {sel: '#btnGps', t: 'GPS', x: 'Zeigt dich als blauen Punkt. Mit [follow] darunter folgt die Karte dir.', hint: 'Tippe jetzt auf [loc].', tap: true},
  {sel: '#bNext', t: 'Nächstes offenes Objekt', x: 'Springt zum nächsten offenen Punkt. Oder tippe einfach einen Marker an.', hint: 'Probier es aus.', tap: true},
  {sel: '#sheet', t: 'Prüfen', before: () => { if (!selId) nextOpen(); }, x: 'Oben steht, was du suchst. Dann Stimmt, Fehlt oder Woanders.'},
  {sel: '#bAdd', before: () => { if (selId) { selId = null; redrawSel(); renderSheet(); } }, t: 'Neu erfassen', x: 'Mit [plus] trägst du ein, was auf der Karte fehlt – auch Pfade per GPS.'},
  {sel: '#btnList', t: 'Liste', x: '[list] zeigt alle offenen Punkte, nach Entfernung sortiert.'},
  {sel: '#btnMenu', t: 'Menü', x: IS_APP ? '[more] öffnet das Menü: Ergebnis senden, Karte als PDF, offline speichern, Filter.' : '[more] öffnet das Menü: Ergebnis, Filter und Legende.'},
  {t: 'Fertig', x: (!IS_APP ? 'Deine Einträge landen im Speicher dieser Seite.'
      : box && box.key ? 'Am Ende im Menü [more] auf „Ans Kartenteam senden“ tippen. Ohne Netz geht es später von selbst raus.'
      : 'Zum Senden brauchst du einen Einladungslink vom Kartenteam. Bis dahin bleibt alles auf dem Handy.') + ' Diese Einführung gibt es jederzeit über [help].', last: true},
].filter(Boolean);
function startTour(){
  endTour(); openPanel(null);
  if (mode === 'path') { draft = []; drawDraft(); }
  setMode(null); showForm = false; addOpen = false; if (selNewId) { selNewId = null; drawNews(); } renderSheet();
  const steps = TOUR_STEPS().filter(st => !st.sel || (document.querySelector(st.sel) && !document.querySelector(st.sel).hidden) || st.before);
  const el = document.createElement('div'); el.className = 'tour'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true');
  el.innerHTML = '<div class="blk"></div><div class="blk"></div><div class="blk"></div><div class="blk"></div><div class="ring"></div><div class="card glass-strong" aria-live="polite"></div>';
  document.body.appendChild(el);
  tour = {el, steps, i: 0, tapOff: null};
  window.addEventListener('resize', placeTour); showStep(0);
}
function endTour(){
  if (!tour) return;
  if (tour.tapOff) tour.tapOff();
  window.removeEventListener('resize', placeTour); tour.el.remove(); tour = null;
}
function showStep(i){
  if (!tour) return;
  if (tour.tapOff) { tour.tapOff(); tour.tapOff = null; }
  if (i >= tour.steps.length) return endTour();
  tour.i = i; const st = tour.steps[i];
  if (st.before) st.before();
  const off = LS.get('fc_tour_off', false), n = tour.steps.length;
  const card = tour.el.querySelector('.card');
  card.innerHTML = `<div class="tnav"><div class="dots">${tour.steps.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('')}</div><span class="sp"></span><button class="skip" type="button" id="tSkip">${st.last ? '' : 'Überspringen'}</button></div>
    <h3>${esc(st.t)}</h3><p>${ti(st.x)}</p>${st.hint ? `<div class="hint">${ti(st.hint)}</div>` : ''}
    <label><input type="checkbox" id="tOff" ${off ? 'checked' : ''}> Nicht mehr beim Start zeigen</label>
    <div class="tnav">${i ? '<button class="ib" type="button" id="tBack" style="flex:0 0 auto">Zurück</button>' : ''}<span class="sp"></span>
      <button class="ib pri" type="button" id="tNext" style="flex:0 0 auto">${st.last ? 'Los geht’s' : (i ? 'Weiter' : 'Kurz zeigen')}</button></div>`;
  card.querySelector('#tOff').onchange = (e) => LS.set('fc_tour_off', e.target.checked);
  card.querySelector('#tNext').onclick = () => showStep(i + 1);

  if (!st.last) card.querySelector('#tSkip').onclick = endTour; else card.querySelector('#tSkip').remove();
  if (st.tap && st.sel) {   // tapping the highlighted control does its job and moves the tour on
    const t = document.querySelector(st.sel), h = () => setTimeout(() => showStep(i + 1), 350);
    if (t) { t.addEventListener('click', h); tour.tapOff = () => t.removeEventListener('click', h); }
  }
  placeTour(); setTimeout(placeTour, 120); setTimeout(placeTour, 400);
  card.querySelector('#tNext').focus({preventScroll: true});
}
function placeTour(){
  if (!tour) return;
  const st = tour.steps[tour.i], [b0, b1, b2, b3] = tour.el.querySelectorAll('.blk'), ring = tour.el.querySelector('.ring'), card = tour.el.querySelector('.card');
  const W_ = window.innerWidth, H_ = window.innerHeight, t = st.sel && document.querySelector(st.sel);
  const set = (e, l, tp, w, h) => Object.assign(e.style, {left: l + 'px', top: tp + 'px', width: Math.max(0, w) + 'px', height: Math.max(0, h) + 'px'});
  if (!t || !t.offsetWidth) {   // no target: dim everything, card in the middle
    set(b0, 0, 0, W_, H_); [b1, b2, b3].forEach(b => set(b, 0, 0, 0, 0)); ring.style.display = 'none';
    Object.assign(card.style, {top: Math.max(16, (H_ - card.offsetHeight) / 2) + 'px', bottom: 'auto'}); return;
  }
  const r = t.getBoundingClientRect(), pd = st.pad === undefined ? 6 : st.pad;
  const L_ = Math.max(0, r.left - pd), T_ = Math.max(0, r.top - pd), R_ = Math.min(W_, r.right + pd), B_ = Math.min(H_, r.bottom + pd);
  set(b0, 0, 0, W_, T_); set(b1, 0, B_, W_, H_ - B_); set(b2, 0, T_, L_, B_ - T_); set(b3, R_, T_, W_ - R_, B_ - T_);
  ring.style.display = ''; set(ring, L_, T_, R_ - L_, B_ - T_);
  const ch = card.offsetHeight, below = H_ - B_, above = T_;

  else if (above >= ch + 24) Object.assign(card.style, {top: (T_ - ch - 14) + 'px', bottom: 'auto'});
  else Object.assign(card.style, {top: Math.max(12, (H_ - ch) / 2) + 'px', bottom: 'auto'});   // big target (map): card floats over it
