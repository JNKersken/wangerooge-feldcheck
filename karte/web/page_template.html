<title>Feldcheck Wangerooge West</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Caveat:wght@600;700&display=swap">
<style>
/* Layout: one-screen field tool — paper map fills the screen, a bottom sheet (side panel on wide screens) carries the selected landmark and the three verdict buttons. */
:root{
  --paper:#fffdf7; --panel:#fffdf7; --ink:#1f1d24; --muted:#6b6676; --line:#ddd6c8; --chip:#f2eee5;
  --accent:#a3237f; --accent-ink:#ffffff; --ok:#2e9d57; --bad:#cf4136; --move:#d98a1c; --sel:#2b6fd6;
  --f-display:"Caveat","Segoe Print","Bradley Hand",cursive; --f-ui:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#17151b;--panel:#1f1c24;--ink:#f1ede5;--muted:#a7a1b0;--line:#38333f;--chip:#2a2630;--accent:#e46bc4;--accent-ink:#17151b;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#17151b;--panel:#1f1c24;--ink:#f1ede5;--muted:#a7a1b0;--line:#38333f;--chip:#2a2630;--accent:#e46bc4;--accent-ink:#17151b;color-scheme:dark}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;overflow:hidden}
/*LEAFLET*/
#app{position:relative;height:100%;display:grid;grid-template-rows:auto 1fr}
.bar{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel);z-index:5}
.brand{font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1;white-space:nowrap}
.brand small{font-family:var(--f-ui);font-size:12px;font-weight:400;color:var(--muted);display:block;letter-spacing:.04em;text-transform:uppercase;margin-top:2px}
.prog{flex:1;min-width:0;display:grid;gap:4px;justify-items:end}
.prog b{font-variant-numeric:tabular-nums;font-size:14px}
.meter{width:min(220px,100%);height:6px;border-radius:3px;background:var(--chip);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
button{font:inherit;color:inherit;cursor:pointer}
.ib{border:1px solid var(--line);background:var(--chip);border-radius:8px;padding:7px 10px;font-size:14px;white-space:nowrap}
.bar .ib{padding:6px 9px}
.ib:focus-visible,.act:focus-visible,.chip:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
#map{position:relative;background:#fffdf7;z-index:1}
.leaflet-container{background:#fffdf7;font-family:var(--f-ui)}
#banner{position:absolute;top:58px;left:50%;transform:translateX(-50%);z-index:20;background:var(--accent);color:var(--accent-ink);padding:9px 14px;border-radius:999px;font-weight:700;display:flex;gap:10px;align-items:center;box-shadow:0 4px 16px #0003;max-width:calc(100% - 32px)}
#banner button{background:transparent;border:1px solid currentColor;border-radius:999px;padding:3px 10px;color:inherit;font-size:13px}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:10;background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -6px 20px #0002;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));max-height:52%;overflow:auto;display:grid;gap:10px}
@media (min-width:820px){.sheet{left:auto;top:57px;width:370px;max-height:none;border-top:0;border-left:1px solid var(--line);box-shadow:-6px 0 20px #0001;align-content:start}}
.kicker{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;letter-spacing:.02em;text-transform:none}
.p-open{background:var(--chip);color:var(--muted)} .p-ok{background:var(--ok);color:#fff} .p-bad{background:var(--bad);color:#fff} .p-move{background:var(--move);color:#1b1305} .p-sure{background:var(--chip);color:var(--ink)}
h2{margin:0;font-size:19px;line-height:1.25;text-wrap:balance}
.meta{color:var(--muted);font-size:13.5px;line-height:1.45}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.act{border:0;border-radius:var(--r);padding:12px 6px;font-weight:700;font-size:15px;display:grid;gap:2px;justify-items:center}
.act span{font-size:11.5px;font-weight:400;opacity:.9}
.a-ok{background:var(--ok);color:#fff}.a-bad{background:var(--bad);color:#fff}.a-move{background:var(--move);color:#1b1305}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .ib{flex:1 1 auto}
textarea{width:100%;box-sizing:border-box;font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px;min-height:40px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:6px 11px;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.status{font-size:12.5px;color:var(--muted)}
.status.warn{color:var(--bad)}
.panel{position:absolute;inset:57px 0 0 0;z-index:15;background:var(--panel);overflow:auto;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;align-content:start}
@media (min-width:820px){.panel{left:auto;width:370px;border-left:1px solid var(--line)}}
.panel h3{margin:0;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.list{display:grid;gap:2px}
.li{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;text-align:left;border:0;background:transparent;border-bottom:1px solid var(--line);padding:9px 2px}
.li small{color:var(--muted)}
.li .d{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
pre{white-space:pre-wrap;word-break:break-all;font-size:11px;background:var(--chip);padding:8px;border-radius:8px;max-height:160px;overflow:auto}
.ico{width:22px;height:22px}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;font-size:13px}
.legend div{display:flex;gap:8px;align-items:center}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid #8f8a96;flex:none}
.gpsb[data-st="on"]{background:var(--sel);color:#fff;border-color:var(--sel)} .gpsb[data-st="wait"]{background:var(--chip);color:var(--sel);border-color:var(--sel)} .gpsb[data-st="err"]{color:var(--bad);border-color:var(--bad)}
.ctl{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;width:40px;height:40px;font-size:20px;line-height:38px;text-align:center;box-shadow:0 2px 8px #0002;padding:0}
.ctl[aria-pressed="true"]{background:var(--sel);color:#fff;border-color:var(--sel)}
.a-here{background:var(--sel);color:#fff;border:0;border-radius:var(--r);padding:11px 8px;font-weight:700;font-size:14.5px}
.rec{color:var(--bad);font-weight:700}
#pv{border:1px solid var(--line);border-radius:8px;background:#fffdf7;overflow:hidden;min-height:120px;display:grid;place-items:center}
#pv svg{width:100%;height:auto;display:block}
.pvwrap{position:sticky;top:-14px;z-index:3;background:var(--panel);padding:8px 0 6px;display:grid;gap:6px;box-shadow:0 8px 10px -8px #0003}
.pgrp{display:grid;gap:6px}
.big{width:100%;padding:12px;font-weight:700;background:var(--accent);color:var(--accent-ink);border:0;border-radius:var(--r);font-size:15px}
.big:disabled{opacity:.6}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div id="app">
  <header class="bar">
    <div class="brand">Feldcheck<small>Wangerooge West</small></div>
    <div class="prog" aria-live="polite"><b id="progTxt">–/–</b><div class="meter"><i id="meterFill"></i></div></div>
    <button class="ib gpsb" id="btnGps" type="button" data-st="off" hidden>GPS</button>
    <button class="ib" id="btnList" type="button">Liste</button>
    <button class="ib" id="btnMenu" type="button">Mehr</button>
  </header>
  <div id="map" role="application" aria-label="Karte Wangerooge West"></div>
  <div id="banner" hidden><span id="bannerTxt"></span><button id="bannerCancel" type="button">Abbrechen</button></div>
  <section class="sheet" id="sheet" aria-live="polite"></section>
  <section class="panel" id="listPanel" hidden></section>
  <section class="panel" id="menuPanel" hidden></section>
  <section class="panel" id="pdfPanel" hidden></section>
</div>

<!--LEAFLETJS-->
<script>
(() => {
const IS_APP = /*ISAPP*/false;   // standalone web app (own domain): real GPS, offline cache, file export
const X0 = 423750, Y1 = 5961650, W = 3400, H = 2800;
// WGS84 -> UTM zone 32N (ETRS89/UTM32, EPSG:25832; sub-metre agreement, far below phone GPS accuracy)
function toUTM(lat, lon){
  const a = 6378137, f = 1 / 298.257222101, k0 = 0.9996, e2 = f * (2 - f), ep2 = e2 / (1 - e2), d = Math.PI / 180;
  const phi = lat * d, A = Math.cos(phi) * (lon - 9) * d, sn = Math.sin(phi), N = a / Math.sqrt(1 - e2 * sn * sn), T = Math.tan(phi) ** 2, C = ep2 * Math.cos(phi) ** 2;
  const M = a * ((1 - e2 / 4 - 3 * e2 * e2 / 64 - 5 * e2 ** 3 / 256) * phi - (3 * e2 / 8 + 3 * e2 * e2 / 32 + 45 * e2 ** 3 / 1024) * Math.sin(2 * phi)
          + (15 * e2 * e2 / 256 + 45 * e2 ** 3 / 1024) * Math.sin(4 * phi) - (35 * e2 ** 3 / 3072) * Math.sin(6 * phi));
  const E = 500000 + k0 * N * (A + (1 - T + C) * A ** 3 / 6 + (5 - 18 * T + T * T + 72 * C - 58 * ep2) * A ** 5 / 120);
  const Nn = k0 * (M + N * Math.tan(phi) * (A * A / 2 + (5 - T + 9 * C + 4 * C * C) * A ** 4 / 24 + (61 - 58 * T + T * T + 600 * C - 330 * ep2) * A ** 6 / 720));
  return [Math.round(E * 10) / 10, Math.round(Nn * 10) / 10];
}
const HEAD_CORR = 4.4;   // magnetic -> grid north on Wangerooge (declination ~+3.5°, convergence ~-0.9°)
const ll = (e, n) => L.latLng(n - Y1, e - X0);
const en = (p) => [Math.round((p.lng + X0) * 10) / 10, Math.round((p.lat + Y1) * 10) / 10];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS = {get(k, d){try{const v = localStorage.getItem(k); return v ? JSON.parse(v) : d}catch(e){return d}}, set(k, v){try{localStorage.setItem(k, JSON.stringify(v))}catch(e){}}};

const CAT = {
  'Bank':['Bank','M4 9H16M6 9V14M14 9V14'], 'Trichter':['Grube/Trichter','M5 7L10 14L15 7'], 'Gewässer':['Tümpel','M6 11a4 4 0 1 0 8 0a4 4 0 1 0 -8 0'],
  'Rettungspunkt':['SOS-Schild','M10 5V15M5 10H15'], 'Durchgang':['Tor/Durchlass','M5 6V14M15 6V14M5 8H15M5 12.5H15M5 12.5L15 8'], 'Kleinobjekt':['Infotafel & Co.','M10 9V14M10 6.2V6.4'],
  'Gastronomie':['Gastronomie','M6 7L7 14H13L14 7Z'], 'Bauwerk':['Bauwerk','M5 13L10 6L15 13Z'], 'Einrichtung':['Einrichtung','M8 10a2 2 0 1 0 4 0a2 2 0 1 0 -4 0'],
  'Historisch':['Gedenkort','M10 5V15M7 8H13'], 'Dünenübergang':['Dünenübergang','M7 5V15M13 5V15M7 8H13M7 12H13'], 'Unterkunft':['Heim','M5 10L10 5L15 10V15H5Z'],
  'Gebäude':['Gebäude','M5 10L10 5L15 10V15H5Z'], 'Gelände':['Düne','M4 14L10 6L16 14Z'], 'Vegetation':['Wäldchen','M10 15V11M6 9a4 4 0 1 0 8 0a4 4 0 1 0 -8 0'],
  'Pfad':['Pfad','M3 15L7 11M9 9L11 7M13 5L17 3'],
  'Kuppe':['Dünenkuppe','M4 14Q10 4 16 14M10 9V9.2'], 'Steilhang':['Steilhang','M4 8H16M6 8V12M10 8V12M14 8V12'], 'Busch':['Busch','M7 10a3 3 0 1 0 6 0a3 3 0 1 0 -6 0'],
  'km-Stein':['km-Stein','M8 15V7L10 5L12 7V15Z'], 'Bahnübergang':['Bahnübergang','M5 5L15 15M15 5L5 15'], 'Haltepunkt':['Haltepunkt','M7 5V15M13 5V15M7 10H13'],
  'Buhne':['Buhne','M4 15L16 5M7 15L9 13'], 'Brücke':['Brücke/Durchlass','M4 7Q10 11 16 7M4 13Q10 9 16 13'], 'Hydrant':['Hydrant','M7 15V8H13V15M6 8H14M10 8V5'],
  'Spielplatz':['Spielplatz','M5 15L8 5H12L15 15M8 5V10'], 'Sportplatz':['Sportplatz','M4 6H16V14H4ZM10 6V14'], 'Fitness':['Fitness','M8 12L12 8M4.5 12.5L7.5 15.5M12.5 4.5L15.5 7.5'],
  'Recycling':['Container','M5 8H15L14 15H6ZM8 6H12'], 'Fahrradständer':['Fahrradständer','M4 13a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0 -5 0M11 13a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0 -5 0M6.5 13L10 8L13.5 13'],
  'Umspannstation':['Trafostation','M11 4L7 11H11L9 16L14 9H10Z'],
  'Neu':['Neu','M10 4L12 9H17L13 12L14.5 17L10 14L5.5 17L7 12L3 9H8Z'],
};
const FILL = {open:'#ffffff', ok:'#2e9d57', fehlt:'#cf4136', woanders:'#d98a1c', sure:'#4a3f55', neu:'#2b6fd6'};
const SURE_ZOOM = 0;
const VERB = {ok:'Stimmt', fehlt:'Fehlt', woanders:'Woanders'};
const NEWGROUPS = [
  ['Nur vor Ort erfassbar', ['Ruhezonen-Schild','Ruhezonen-Pfahl','Strandaufgang (Nr.)','Findling / Stein','Pfahl / Pfosten','Fahnenmast','Einzelbaum','Schild (sonstiges)']],
  ['Weitere Landmarken', ['Bank','SOS-Schild','Markanter Busch','Grube / Trichter','Tümpel','Dünenkuppe','Steilhang / Abbruch','Dünenübergang','Tor / Durchlass','Infotafel','Schutzhütte','Sandfangzaun','Holzsteg','Sonstiges']]];
const NEWTYPES = NEWGROUPS.flatMap(g => g[1]);
const typeChips = (cur) => NEWGROUPS.map(([h, ts]) => `<div class="kicker" style="margin-top:2px">${esc(h)}</div><div class="chips">${ts.map(t => `<button class="chip" type="button" data-t="${esc(t)}" aria-pressed="${t === cur}">${esc(t)}</button>`).join('')}</div>`).join('');

let DATA = null, byId = {}, markers = {}, lines = {}, moveLines = {};
let verdicts = {};             // confirmed from store (or local when no store)
let pending = LS.get('fc_pending', {});   // local writes not yet confirmed
let news = {}; let pendingNew = LS.get('fc_pendingNew', {});
let selId = null, mode = null, addType = null, draft = [], draftLine = null, formDraft = null, showForm = false;
let showAll = LS.get('fc_showAll', false), catOff = new Set(LS.get('fc_catOff', [])), me = LS.get('fc_me', null), meMarker = null;
let db = null, storeState = 'connecting';
let gps = {on: false, watch: null, pos: null, acc: null, t: 0, head: null, err: null}, follow = false, rec = null, accLayer = null;
// ---------- Briefkasten (GitHub): results go to branch "eingang", a GitHub Action merges them and asks the owner to approve ----------
const GH = {owner: 'JNKersken', repo: 'wangerooge-feldcheck', branch: 'eingang', dir: 'karte/data/feldcheck/eingang'};
let box = LS.get('fc_box', null);   // {key, name}
// iOS gives a Home-Screen app its own storage and copies only cookies from Safari when the icon is added.
// So the key also goes into a cookie: open the invitation link in Safari, then "Zum Home-Bildschirm" – the app is set up.
const BOX_PATH = location.pathname.replace(/[^/]*$/, '');
function boxCookie(b){ try { document.cookie = 'fc_box=' + (b ? encodeURIComponent(JSON.stringify(b)) + '; Max-Age=31536000' : '; Max-Age=0') + '; Path=' + BOX_PATH + '; SameSite=Strict' + (location.protocol === 'https:' ? '; Secure' : ''); } catch(e) {} }
function parseInvite(s){   // full invitation link or bare key
  s = (s || '').trim(); if (!s.includes('key=')) return s ? {key: s} : null;
  const h = new URLSearchParams(s.slice(s.indexOf('#') + 1).replace(/^[^?]*\?/, '')); return h.get('key') ? {key: h.get('key').trim(), name: (h.get('name') || '').trim()} : null;
}
if (IS_APP && location.hash.includes('key=')) {
  const b = parseInvite(location.hash);
  if (b) { box = {key: b.key, name: b.name || box && box.name || ''}; LS.set('fc_box', box); boxCookie(box); }
  history.replaceState(null, '', location.pathname + location.search);   // key never stays in the address bar
}
if (IS_APP && !box) { const m = document.cookie.match(/(?:^|;\s*)fc_box=([^;]+)/); if (m) { try { box = JSON.parse(decodeURIComponent(m[1])); if (box && box.key) LS.set('fc_box', box); else box = null; } catch(e) { box = null; } } }

const map = L.map('map', {crs: L.CRS.Simple, minZoom: -2, maxZoom: 3, zoomSnap: .25, zoomDelta: .5, attributionControl: false, zoomControl: false, maxBoundsViscosity: .8});
const B = L.latLngBounds(ll(X0, Y1 - H), ll(X0 + W, Y1));
map.setMaxBounds(B.pad(.15));
const Tiles = L.TileLayer.extend({getTileUrl(c){return `t${c.z + 2}_${c.x}_${c.y}.png`}});
new Tiles('', {tileSize: 512, minZoom: -2, maxZoom: 3, minNativeZoom: -2, maxNativeZoom: 1, bounds: B, noWrap: true,
  errorTileUrl: 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=='}).addTo(map);
L.control.zoom({position: 'topleft'}).addTo(map);
map.fitBounds(L.latLngBounds(ll(424150, 5960050), ll(425350, 5961000)));

const vOf = (id) => pending[id] || verdicts[id] || null;
function stateOf(it){ const v = vOf(it.id); if (v) return v.st; return it.s === 'sicher' ? 'sure' : 'open'; }
function icon(it, selected){
  const st = stateOf(it), c = CAT[it.k] || CAT['Kleinobjekt'];
  const sz = st === 'sure' ? (it.k === 'Trichter' ? 16 : 19) : (it.k === 'Trichter' ? 20 : 24), glyph = (st === 'ok' || st === 'fehlt' || st === 'sure') ? '#ffffff' : '#1f1d24';
  const ring = selected ? '#2b6fd6' : (st === 'open' ? '#7d7787' : (st === 'sure' ? '#ffffff' : 'rgba(0,0,0,.35)'));
  const html = `<svg class="ico" width="${sz}" height="${sz}" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8.6" fill="${FILL[st]}" stroke="${ring}" stroke-width="${selected ? 2.4 : 1.4}"/><path d="${c[1]}" fill="none" stroke="${glyph}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  return L.divIcon({html, className: '', iconSize: [sz, sz], iconAnchor: [sz / 2, sz / 2]});
}
function visible(it){ if (catOff.has(it.k)) return false; if (it.s === 'sicher' && !showAll && !vOf(it.id) && it.id !== selId && map.getZoom() < SURE_ZOOM) return false; return true; }
let sureVis = null;
map.on('zoomend', () => { const v = map.getZoom() >= SURE_ZOOM; if (DATA && v !== sureVis) { sureVis = v; DATA.items.forEach(i => { if (i.s === 'sicher') drawItem(i); }); } });

function drawItem(it){
  const sel = it.id === selId;
  if (it.c){ // path
    const st = stateOf(it), col = st === 'open' ? '#6f4aa0' : FILL[st];
    if (lines[it.id]) map.removeLayer(lines[it.id]);
    if (!visible(it)) return;
    lines[it.id] = L.polyline(it.c.map(p => ll(p[0], p[1])), {color: sel ? '#2b6fd6' : col, weight: sel ? 7 : 5, opacity: .85, dashArray: st === 'open' ? '8 7' : null})
      .on('click', (e) => { L.DomEvent.stop(e); onTap(e.latlng, it.id); }).addTo(map);
    return;
  }
  if (markers[it.id]) { map.removeLayer(markers[it.id]); delete markers[it.id]; }
  if (moveLines[it.id]) { map.removeLayer(moveLines[it.id]); delete moveLines[it.id]; }
  if (!visible(it)) return;
  const v = vOf(it.id);
  markers[it.id] = L.marker(ll(it.e, it.nn), {icon: icon(it, sel), keyboard: false, zIndexOffset: sel ? 1000 : (it.s === 'sicher' ? 0 : 100)})
    .on('click', (e) => { L.DomEvent.stop(e); onTap(e.latlng, it.id); }).addTo(map);
  if (v && v.st === 'woanders' && v.e){
    moveLines[it.id] = L.layerGroup([
      L.polyline([ll(it.e, it.nn), ll(v.e, v.n)], {color: '#d98a1c', weight: 2.5, dashArray: '4 4'}),
      L.circleMarker(ll(v.e, v.n), {radius: 6, color: '#7a4a07', weight: 2, fillColor: '#d98a1c', fillOpacity: 1})
    ]).addTo(map);
  }
}
let newLayer = L.layerGroup().addTo(map);
function drawNews(){
  newLayer.clearLayers();
  const all = {...news, ...pendingNew};
  for (const [id, n] of Object.entries(all)){
    if (byId['F' + id] || (DATA && DATA.merged && DATA.merged.includes('F' + id))) continue;   // already part of the map
    if (n.pts && n.pts.length > 1) newLayer.addLayer(L.polyline(n.pts.map(p => ll(p[0], p[1])), {color: '#2b6fd6', weight: 4}));
    const p = n.pts ? n.pts[0] : [n.e, n.n];
    newLayer.addLayer(L.marker(ll(p[0], p[1]), {icon: L.divIcon({className: '', iconSize: [22, 22], iconAnchor: [11, 11],

function saveVerdict(id, v){

}
function saveNew(id, n){

function storeText(){

async function initStore(){

  if (!db) { storeState = 'local'; Object.assign(verdicts, pending); Object.assign(news, pendingNew); renderSheet(); redrawAll(); return; }
  db.collection('pruefung').onSnapshot((snap) => {
    verdicts = {}; snap.docs.forEach(d => { verdicts[d.id] = d.data(); });
    for (const id of Object.keys(pending)){ // confirmed?
      const a = pending[id], b = verdicts[id];
      if (b && a && b.t === a.t) delete pending[id];
      else if (!snap.metadata.hasPendingWrites && (!chains[id])) queueWrite(id, () => db.collection('pruefung').doc(id).set(a)); // retry offline leftovers
    }
    LS.set('fc_pending', pending); storeState = 'ok'; redrawAll(); renderSheet();
  }, () => { setStore('err'); });
  db.collection('neu').onSnapshot((snap) => {
    news = {}; snap.docs.forEach(d => { news[d.id] = d.data(); });
    for (const id of Object.keys(pendingNew)) if (news[id]) delete pendingNew[id];
    LS.set('fc_pendingNew', pendingNew); drawNews();
  }, () => { setStore('err'); });
}

function sentText(){ const s = LS.get('fc_sent', null); return s ? `Zuletzt gesendet: ${new Date(s.t).toLocaleString('de-DE', {dateStyle: 'short', timeStyle: 'short'})} (${s.nv} Bewertungen, ${s.nn} neue Objekte)` : 'Noch nichts gesendet.'; }
function b64utf8(str){ const b = new TextEncoder().encode(str); let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); }
async function sendBox(res){
  const st = $('sendSt'), btn = $('bSend'); const nv = Object.keys(res.verdicts).length, nn = Object.keys(res.neu).length;
  if (!nv && !nn) { st.textContent = 'Noch keine Einträge zum Senden.'; return; }
  btn.disabled = true; st.className = 'status'; st.textContent = 'Sende …';
  const who = (box.name || 'ohne-name'), slug = who.toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'helfer';
  const now = new Date(), stamp = now.toISOString().slice(0, 16).replace(/[:T]/g, '-');
  const path = `${GH.dir}/${stamp}_${slug}_${Math.random().toString(36).slice(2, 6)}.json`;
  const body = JSON.stringify({name: who, gesendet: now.toISOString(), geraet: navigator.userAgent.slice(0, 120), verdicts: res.verdicts, neu: res.neu}, null, 1);
  try {
    const r = await fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${path}`, {method: 'PUT',
      headers: {'Authorization': 'Bearer ' + box.key, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'},
      body: JSON.stringify({message: `Feldcheck von ${who}: ${nv} Bewertungen, ${nn} neue Objekte`, content: b64utf8(body), branch: GH.branch})});
    if (r.status === 201 || r.status === 200) {
      LS.set('fc_sent', {t: Date.now(), nv, nn});
      // wake the GitHub Action (runs from main); if this fails the daily run picks the file up
      fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}/dispatches`, {method: 'POST', headers: {'Authorization': 'Bearer ' + box.key, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'},
        body: JSON.stringify({event_type: 'feldcheck', client_payload: {datei: path}})}).catch(() => {});
      st.textContent = 'Gesendet. Die Karte wird automatisch neu berechnet; nach der Freigabe erscheint alles in App und PDF. ' + sentText();
    }
    else if (r.status === 401) { st.className = 'status warn'; st.textContent = 'Schlüssel ungültig oder abgelaufen – bitte neuen Einladungslink anfordern.'; }
    else if (r.status === 403 || r.status === 404) { st.className = 'status warn'; st.textContent = `Keine Berechtigung für den Briefkasten (Fehler ${r.status}). Schlüssel prüfen lassen.`; }
    else { st.className = 'status warn'; st.textContent = `Senden fehlgeschlagen (Fehler ${r.status}). Später erneut versuchen.`; }
  } catch(e) { st.className = 'status warn'; st.textContent = 'Kein Netz – die Einträge bleiben auf dem Handy. Später erneut senden.'; }
  btn.disabled = false;
}

  P.querySelectorAll('[data-md]').forEach(b => b.onclick = () => { pdfSel.mode = b.dataset.md; P.querySelectorAll('[data-md]').forEach(x => x.setAttribute('aria-pressed', x === b)); savePdfSel(); preview(); });
  P.querySelectorAll('[data-ly]').forEach(b => b.onclick = () => { const k = b.dataset.ly; pdfSel.off = pdfSel.off.includes(k) ? pdfSel.off.filter(x => x !== k) : pdfSel.off.concat(k);
    b.setAttribute('aria-pressed', !pdfSel.off.includes(k)); savePdfSel(); applyHide(); });
  $('lyAll').onclick = () => { pdfSel.off = []; savePdfSel(); renderPdfPanel(); };
  $('lyMin').onclick = () => { pdfSel.off = ['contours', 'summits', 'steep', 'pits', 'veg', 'sand', 'open', 'small', 'facilities', 'north']; savePdfSel(); renderPdfPanel(); };
  $('pdfGo').onclick = makePdf;
  preview();
}
function applyHide(){ const st = $('pvStyle'); if (st) st.textContent = pdfSel.off.length ? `#pv :is(${hideSel(pdfSel.off)}){display:none}` : ''; }
async function preview(){
  const M = await kartenMeta(), sh = M.sheets.find(s => s.id === pdfSel.sheets[0]), url = sh.files[pdfSel.mode] || sh.files.color, tok = ++pvToken;
  $('pvName').textContent = '· ' + sh.title; $('pv').innerHTML = '<p class="meta">Lade Vorschau …</p>'; applyHide();
  try { const t = await svgText(url); if (tok !== pvToken) return; $('pv').innerHTML = t.replace(/^[\s\S]*?(<svg)/, '$1'); }
  catch(e) { $('pv').innerHTML = '<p class="status warn">Vorschau nicht geladen – Netz prüfen.</p>'; }
}
async function makePdf(){
  const M = await kartenMeta(), btn = $('pdfGo'), st = $('pdfSt'); btn.disabled = true;
  try {
    st.textContent = 'Lade PDF-Werkzeug …'; await loadScript('lib/jspdf.umd.min.js'); await loadScript('lib/svg2pdf.umd.min.js');
    const host = document.createElement('div'); host.style.cssText = 'position:fixed;left:-99999px;top:0;width:10px;height:10px;overflow:hidden'; document.body.appendChild(host);
    let pdf = null; const list = M.sheets.filter(s => pdfSel.sheets.includes(s.id));
    for (let i = 0; i < list.length; i++){
      const sh = list[i]; st.textContent = `Erzeuge ${sh.title} (${i + 1}/${list.length}) …`;
      const txt = await svgText(sh.files[pdfSel.mode] || sh.files.color);
      const svg = new DOMParser().parseFromString(txt, 'image/svg+xml').documentElement;
      if (pdfSel.off.length) svg.querySelectorAll(hideSel(pdfSel.off)).forEach(e => {   // keep shared <defs> (glyphs, markers) that other groups reuse
        e.querySelectorAll('defs').forEach(d => svg.appendChild(d)); e.remove(); });
      host.appendChild(svg);
      const Wd = parseFloat(svg.getAttribute('width')), Hd = parseFloat(svg.getAttribute('height')), ori = Wd > Hd ? 'landscape' : 'portrait';
      if (!pdf) pdf = new window.jspdf.jsPDF({orientation: ori, unit: 'pt', format: [Wd, Hd], compress: true}); else pdf.addPage([Wd, Hd], ori);
      await pdf.svg(svg, {x: 0, y: 0, width: Wd, height: Hd}); host.removeChild(svg);
      await new Promise(r => setTimeout(r, 30));
    }
    host.remove();
    const off = pdfSel.off.length ? '_ohne-' + pdfSel.off.length + '-Ebenen' : '';
    const name = `Wangerooge_West_${list.length === M.sheets.length ? 'alle-Blaetter' : list.map(s => s.id.replace('detail_', '')).join('-')}_${pdfSel.mode === 'bw' ? 'SW' : 'Farbe'}${off}.pdf`;
    const file = new File([pdf.output('blob')], name, {type: 'application/pdf'});
    st.textContent = `Fertig: ${name} (${(file.size / 1048576).toFixed(1)} MB)`;
    try { if (navigator.canShare && navigator.canShare({files: [file]})) { await navigator.share({files: [file], title: name}); btn.disabled = false; return; } } catch(e) { if (e && e.name === 'AbortError') { btn.disabled = false; return; } }
    const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  } catch(e) { st.textContent = 'PDF konnte nicht erzeugt werden: ' + (e && e.message || e); st.className = 'status warn'; }
  btn.disabled = false;
}

fetch('data.json').then(r => r.json()).then(d => {
  DATA = d; DATA.items.forEach(i => byId[i.id] = i); DATA.paths.forEach(p => byId[p.id] = p);
  redrawAll(); drawMe(); renderSheet(); initStore();
}).catch(() => { $('sheet').innerHTML = '<p class="status warn">Die Objektliste konnte nicht geladen werden. Bitte Seite neu laden.</p>'; });
})();
